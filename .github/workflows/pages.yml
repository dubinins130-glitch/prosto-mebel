name: Deploy Prosto Mebel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run typecheck
      - name: Verify that exported assets use the Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module <<'NODE'
          import { access, readFile } from 'node:fs/promises';
          const page = await readFile('out/index.html', 'utf8');
          const base = process.env.PAGES_BASE_PATH;
          for (const folder of ['/images/', '/_next/static/']) {
            if (!page.includes(base + folder)) throw new Error('Missing asset path ' + base + folder);
          }
          for (const route of ['kitchens','wardrobes','dressing-rooms','hallways','children']) {
            await access('out/' + route + '/index.html');
          }
          NODE
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
